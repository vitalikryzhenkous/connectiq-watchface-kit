id: t08_sleep_animation
title: Sleep-aware animation (fr945)
difficulty: 8
devices: [fr945]
compile: true
prompt: |
  Build a watch face for the Forerunner 945 with time (HH:MM) and a small animated element that changes
  every second (for example a blinking colon, a seconds sweep or a pulsing dot).
  - Animate only while the watch is awake (the wrist gesture lit the display). In low-power mode the
    element must be static and the face should redraw only once per minute.
  - Track the state with onEnterSleep()/onExitSleep() and a flag, and call WatchUi.requestUpdate() in both.
  - Do not use Timer. Drive the animation from onUpdate using System.getClockTime().sec.
  - Light colors from the 64-color MIP palette on black.
required:
  - manifest_valid
  - resources_valid
  - devices_in_manifest
  - no_permissions
  - mip_palette
  - {check: pattern, pattern: 'function\s+onEnterSleep\s*\(', label: onEnterSleep}
  - {check: pattern, pattern: 'function\s+onExitSleep\s*\(', label: onExitSleep}
  - {check: pattern, pattern: 'requestUpdate\(\)', label: requestUpdate}
  - {check: pattern, pattern: '(?i)(awake|asleep|sleeping|inSleep|lowPower)', label: awake/sleep flag}
  - {check: pattern, pattern: '\.sec\b', label: seconds-driven animation}
  - {check: forbid, pattern: 'Timer\.Timer|new\s+Timer', label: no Timer}
